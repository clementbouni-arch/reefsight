[project]
name = "reefsight"
version = "0.1.0"
description = "Fine-tuned Faster R-CNN that detects and identifies aquarium fish species."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torchmetrics>=1.3",
    "kagglehub>=0.2",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pillow>=10.2",
    "jupyterlab>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
